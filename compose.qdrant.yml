services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: homesanj-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - homesanj_qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"


volumes:
  homesanj_qdrant_storage:
